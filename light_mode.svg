<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono,Consolas,ui-monospace,monospace" width="985px" height="580px" font-size="16px">
<style>
@font-face {
src: local('JetBrains Mono'), local('JetBrainsMono'), local('Consolas');
font-family: 'JetBrains Mono';
font-display: swap;
}
.key {fill: #F45C1C;}
.value {fill: #0a0a0b;}
.addColor {fill: #0a0a0b;}
.delColor {fill: #F45C1C;}
.cc {fill: #8e8e96;}
.head {fill: #0a0a0b;}
text, tspan {white-space: pre;}
.ascii {font-size: 11px;}
</style>
<defs>
<clipPath id="card"><rect width="985" height="580" rx="12"/></clipPath>
<pattern id="dots" width="56" height="56" patternUnits="userSpaceOnUse">
<path d="M0 28h56M28 0v56" fill="none" stroke="#0a0a0b" stroke-opacity="0.08" stroke-width="0.5"/>
<circle cx="28" cy="28" r="1.15" fill="#F45C1C" fill-opacity="0.45"/>
</pattern>
<radialGradient id="glowTop" cx="50%" cy="50%" r="70%">
<stop offset="0%" stop-color="#F45C1C" stop-opacity="0.16"/>
<stop offset="68%" stop-color="#F45C1C" stop-opacity="0"/>
</radialGradient>
<radialGradient id="glowBot" cx="50%" cy="50%" r="70%">
<stop offset="0%" stop-color="#F45C1C" stop-opacity="0.10"/>
<stop offset="70%" stop-color="#F45C1C" stop-opacity="0"/>
</radialGradient>
<linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#F45C1C" stop-opacity="0"/>
<stop offset="45%" stop-color="#F45C1C" stop-opacity="0.025"/>
<stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
<stop offset="55%" stop-color="#F45C1C" stop-opacity="0.025"/>
<stop offset="100%" stop-color="#F45C1C" stop-opacity="0"/>
</linearGradient>
<filter id="grain" x="0%" y="0%" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch"/>
</filter>
<filter id="logoGlow" x="-40%" y="-40%" width="180%" height="180%">
<feGaussianBlur stdDeviation="2.4" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<g clip-path="url(#card)">
<ellipse cx="492" cy="-10" rx="420" ry="230" fill="url(#glowTop)">
<animate attributeName="opacity" values="0.55;1;0.55" dur="7s" repeatCount="indefinite"/>
</ellipse>
<ellipse cx="860" cy="540" rx="260" ry="190" fill="url(#glowBot)">
<animate attributeName="opacity" values="0.4;0.85;0.4" dur="9s" repeatCount="indefinite"/>
</ellipse>
<rect x="-80" y="-80" width="1145" height="840" fill="url(#dots)">
<animateTransform attributeName="transform" type="translate" from="0 0" to="56 56" dur="72s" repeatCount="indefinite"/>
</rect>
<g opacity="0.45">
<rect x="-80" y="-80" width="1145" height="840" fill="url(#dots)">
<animateTransform attributeName="transform" type="translate" from="0 0" to="-56 -40" dur="96s" repeatCount="indefinite"/>
</rect>
</g>
<rect width="985" height="140" fill="url(#scan)">
<animate attributeName="y" values="-140;580" dur="10s" repeatCount="indefinite"/>
</rect>
<rect width="985" height="580" filter="url(#grain)" opacity="0.03"/>
<g filter="url(#logoGlow)">
